[project]
name = "jaba-da-hat"
version = "0.1.0"
description = "Jabber/XMPP-only tray messenger for GNOME"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.8",
    "jeepney>=0.8",
    "slixmpp>=1.17.0",
]

[project.scripts]
jaba-da-hat = "jaba_da_hat.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
build = [
    "nuitka>=2.5",
    "patchelf>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaba_da_hat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
